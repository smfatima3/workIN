[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "memory-robot-safety"
version = "0.2.0"
description = "Controlled source-removal and memory-repair evaluation for simulated robot teams"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "Pillow>=10", "mujoco>=3.2,<4", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
